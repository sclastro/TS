name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/sweet-babbage-17lcda]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 照片自存：沿用上次下載的檔案，只補缺少的
      - uses: actions/cache@v4
        with:
          path: |
            public/photos
            src/data/photo-manifest.json
          key: photos-v1-${{ github.run_id }}
          restore-keys: photos-v1-
      - name: Fetch Wikimedia Commons photos
        run: node scripts/fetch-images.mjs
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
