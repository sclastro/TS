name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/sweet-babbage-17lcda]
  workflow_dispatch:
    inputs:
      yt_refresh:
        description: 'Re-search every song on YouTube (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 照片自存：沿用上次下載的檔案，只補缺少的
      - uses: actions/cache@v4
        with:
          path: |
            public/photos
            src/data/photo-manifest.json
          key: photos-v1-${{ github.run_id }}
          restore-keys: photos-v1-
      - name: Fetch Wikimedia Commons photos
        run: node scripts/fetch-images.mjs
        continue-on-error: true
      # 官方 YouTube 影片配對：沿用上次結果，只搜尋未配對的歌曲
      - uses: actions/cache@v4
        with:
          path: src/data/yt-manifest.json
          key: yt-v1-${{ github.run_id }}
          restore-keys: yt-v1-
      - name: Match official YouTube videos
        run: node scripts/fetch-youtube.mjs
        env:
          YT_REFRESH: ${{ inputs.yt_refresh && '1' || '0' }}
        continue-on-error: true
        timeout-minutes: 25
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
